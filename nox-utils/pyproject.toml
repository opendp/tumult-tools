[project]
name = "tmlt.nox_utils"
description = ""
authors = []
readme = "README.md"

dynamic = ["version"]

requires-python = ">=3.9,<4"
dependencies = [
    "nox >=2022.8.7",
    "uv-dynamic-versioning >=0.8.2,<0.9",
    "GitPython >=3.1.44,<4",
]

[tool.uv]
required-version = ">=0.7.0"
default-groups = "all"

[dependency-groups]
ruff = ["ruff >=0.14.3,<1"]
black = ["black >=23.3"]
isort = ["isort[pyproject] >=5.11,<6"]
mypy = ["mypy >=1.14.0"]
pylint = ["pylint >=3.2.5"]
pydocstyle = ["pydocstyle[toml] >=6.3"]

################################################################################
# Build configuration

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
# The default configuration expect vX.Y.Z, but we haven't been using the 'v' prefix.
pattern = "^(?P<base>\\d+\\.\\d+\\.\\d+)(-(?P<stage>[a-zA-Z]+)\\.(?P<revision>\\d+))?"
commit-length = 8

[tool.hatch.build.targets.wheel]
packages = ["src/tmlt"]

################################################################################
# Linter configuration

[tool.ruff.lint]
# Enable Ruff-specific lints plus Pylint and pydocstyle
select = ["RUF", "PL", "D"]
ignore = [
    "PLR09",   # too-many-*
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
namespace_packages = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# TODO: Re-enable this and fix the resulting warnings
# warn_unreachable = true

[[tool.mypy.overrides]]
module = "test.*"
disallow_untyped_defs = false
check_untyped_defs = true
